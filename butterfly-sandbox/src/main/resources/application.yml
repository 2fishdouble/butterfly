server:
  port: 8080

spring:
  profiles:
    active:
      - test
  application:
    name: sandbox
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.12.22:3306/hotkey_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowMultiQueries=true
    username: root
    password: Mysql.3306.mysql
    type: com.zaxxer.hikari.HikariDataSource
    # HikariCP 连接池详细配置
    hikari:
      # 池中最大连接数（推荐：CPU核心数 * 2 + 核心磁盘数）
      maximum-pool-size: 20
      # 最小空闲连接数（建议与 maximum-pool-size 保持一致，避免频繁创建/销毁连接）
      minimum-idle: 5
      # 空闲连接存活最大超时时间（毫秒），超出的空闲连接将被释放，默认 600000（10分钟）
      idle-timeout: 600000
      # 连接在池中的最大生命周期（毫秒），必须短于 MySQL 的 wait_timeout，默认 1800000（30分钟）
      max-lifetime: 1800000
      # 等待连接池分配连接的最大超时时间（毫秒），超过将抛出 SQLException，默认 30000（30秒）
      connection-timeout: 30000
      # 用于测试连接有效性的 SQL 语句
      connection-test-query: SELECT 1
      # 连接测试超时时间（毫秒），默认 5000（5秒）
      validation-timeout: 5000
      # 自动提交事务，默认 true
      auto-commit: true
      # 连接池名称
      pool-name: HotkeyHikariCP
  data:
    redis:
      host: 192.168.12.23
      port: 51111
      password: Redis.51111.redis
      database: 0
      timeout: 10s
      connect-timeout: 10s
      client-type: lettuce
      lettuce:
        shutdown-timeout: 100ms
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
  kafka:
    bootstrap-servers: 192.168.12.29:9092
  rabbitmq:
    host: 192.168.12.24
    port: 5672
    virtual-host: /
    username: root
    password: Rabbitmq.15672.rabbitmq
    # 打开 confirm 与 return:correlated 是 CorrelationDataPostProcessor 被调用的前提,
    # 也是消息上能盖出 correlationId 的前提
    publisher-confirm-type: correlated
    publisher-returns: true
  mail:
    host: smtp.qq.com
    username: 2737224577@qq.com
    password: rjiaekbmgarwdgda
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
# RocketMQ 的两套地址各司其职:name-server 给老版 remoting 客户端建主题用,proxy 端点给 v5 gRPC 客户端收发用。
# ACL 凭据只配在 rocketmq.producer 下:管理客户端会复用同一对,不必配第二遍。
rocketmq:
  name-server: 192.168.12.29:9876
  producer:
    # RocketMQ 5 代理(proxy)的 gRPC 端口,默认 8081
    endpoints: 192.168.12.29:8081
    access-key: super_admin
    secret-key: Aa123456
    # proxy 是明文 gRPC,而 starter 默认按 TLS 连接,必须显式关掉
    ssl-enabled: false
    # 预取路由:发送前先把该主题的路由拿到本地
    topic: butterfly-sandbox-computer
butterfly:
  security:
    permission:
      enabled: true
      db: true
  mail:
    default-from: 2737224577@qq.com
  kafka:
    topic:
      # 重试与死信的全局默认:每个实体主题默认建立 <主题>-retry-<延迟> 与 <主题>-dlt
      retry:
        attempts: 4
        back-off:
          delay: 1s
          multiplier: 3.0
          max-delay: 30s
      # 主题名/分区数/副本数均可选;这里只覆盖主题名,分区数与副本数用全局默认值
      entities:
        computer:
          name: butterfly-sandbox-computer
          partitions: 1
          replicas: 1
          # 该实体独有的重试覆盖:死信处理器指向消费端的方法
          retry:
            dlt-handler: kafkaComputerConsumer#onDlt
  rabbitmq:
    # 重试与死信的全局默认:失败消息在容器内按退避重试,耗尽后重新投递到 <exchange>.dlx
    retry:
      attempts: 2
      delay: 200ms
      multiplier: 2.0
      max-delay: 3s
    # 拓扑名称/交换机类型/持久化/延时等均可选;这里只覆盖名称,交换机类型、持久化与派生的死信名称用默认规则
    entities:
      computer:
        exchange: butterfly-sandbox-computer
        queue: butterfly-sandbox-computer-queue
        routing-key: butterfly-sandbox.computer
  rocketmq:
    # 一个实体对应一个主题:computer → butterfly-sandbox-computer;
    # 消费组默认取实体类简单名首字母小写(computer),死信与重试主题按 RocketMQ 规则派生成 %DLQ%computer / %RETRY%computer
    entities:
      computer:
        topic: butterfly-sandbox-computer
